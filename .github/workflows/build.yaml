name: Build and Deploy

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: |
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_MAP_KEY }}" > .env
          npm run build
